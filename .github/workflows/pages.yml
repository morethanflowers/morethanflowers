name: Take GitHub Pages Offline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare an empty Pages artifact
        run: |
          mkdir -p pages-dist
          printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>404: Not Found</title></head><body><h1>404</h1><p>Not Found</p></body></html>' > pages-dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: remove
    steps:
      - name: Remove published website
        id: deployment
        uses: actions/deploy-pages@v4
